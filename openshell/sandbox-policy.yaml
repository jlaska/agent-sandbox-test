version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /sandbox

landlock:
  compatibility: best_effort

network_policies:

  github_git:
    name: github-git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/jlaska/agent-sandbox-test.git/info/refs*"
          - allow:
              method: POST
              path: "/jlaska/agent-sandbox-test.git/git-upload-pack"
          - allow:
              method: POST
              path: "/jlaska/agent-sandbox-test.git/git-receive-pack"
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }

  github_api:
    name: github-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/repos/jlaska/agent-sandbox-test"
          - allow:
              method: GET
              path: "/repos/jlaska/agent-sandbox-test/**"
          - allow:
              method: POST
              path: "/repos/jlaska/agent-sandbox-test/pulls"
          - allow:
              method: PATCH
              path: "/repos/jlaska/agent-sandbox-test/pulls/*"
          - allow:
              method: POST
              path: "/repos/jlaska/agent-sandbox-test/issues/*/comments"
          - allow:
              method: POST
              path: "/repos/jlaska/agent-sandbox-test/pulls/*/reviews"
          - allow:
              method: DELETE
              path: "/repos/jlaska/agent-sandbox-test/git/refs/**"
          - allow:
              method: GET
              path: "/user"
          - allow:
              method: GET
              path: "/user/**"
          - allow:
              method: GET
              path: "/rate_limit"
          - allow:
              method: GET
              path: "/app"
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/local/bin/gh }
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }

  github_graphql:
    name: github-graphql
    endpoints:
      - host: api.github.com
        port: 443
        path: "/graphql"
        protocol: graphql
        enforcement: enforce
        rules:
          - allow:
              operation_type: query
          - allow:
              operation_type: mutation
              fields: [createPullRequest, updatePullRequest, addComment, addPullRequestReview, submitPullRequestReview, requestReviews, closePullRequest, reopenPullRequest, markPullRequestReadyForReview, convertPullRequestToDraft]
        deny_rules:
          - operation_type: mutation
            fields: [mergePullRequest, enablePullRequestAutoMerge]
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/local/bin/gh }

  litellm_inference:
    name: litellm-inference
    endpoints:
      - host: litellm.internal.keener.us
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
    binaries:
      - { path: /usr/bin/claude }
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/pi }
      - { path: /usr/local/bin/pi }
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/curl }

  npm_registry:
    name: npm-registry
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        allow_encoded_slash: true
        rules:
          - allow:
              method: GET
              path: "/**"
    binaries:
      - { path: /usr/bin/npm }
      - { path: /usr/local/bin/npm }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }

  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: global-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: us-central1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: us-east5-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: europe-west1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: oauth2.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/token"
    binaries:
      - { path: /usr/bin/claude }
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }

  anthropic_api:
    name: anthropic-api
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
    binaries:
      - { path: /usr/bin/claude }
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }

  claude_telemetry:
    name: claude-telemetry
    endpoints:
      - host: statsig.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
      - host: sentry.io
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
    binaries:
      - { path: /usr/bin/claude }
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
